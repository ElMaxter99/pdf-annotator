server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' blob: data: http://127.0.0.1:4310; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Los scripts de Vercel Insights/Speed Insights solo existen en Vercel: aquí, 404 limpio
    location ^~ /_vercel/ {
        return 404;
    }

    # Un recurso estático que no existe da 404 (no el index.html con 200, que con nosniff
    # solo produce errores de MIME confusos al fallar un chunk)
    location ~* \.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|otf|pdf|webmanifest|wasm)$ {
        try_files $uri =404;
    }

    # Serve static files directly and fallback to index.html for SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip for better performance on text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/octet-stream application/xml application/xml+rss image/svg+xml;
    gzip_min_length 256;
}
