name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Install AI helper dependencies
        run: npm install --no-fund --no-audit --prefix tools/ai-phase0

      - name: AI helper tests
        run: npm test --prefix tools/ai-phase0

      - name: AI helper queue tests
        run: npm run test:helper

      - name: Desktop tests
        run: npm run test:desktop

      - name: Script tests (changelog)
        run: npm run test:scripts

      - name: Audit dependencies (production, high severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Build (includes i18n check)
        run: npm run build

      - name: Unit tests
        run: npm run test:ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Accessibility audit (axe, fails on serious or critical)
        run: npm run a11y:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
            a11y-audit.json
          retention-days: 7

      - name: Desktop app smoke test (Electron)
        run: |
          npm install --no-fund --no-audit --prefix desktop
          node node_modules/electron/install.js
          xvfb-run -a node desktop/smoke.mjs

  # Informativo: comprueba los tipos con TypeScript 7 (compilador nativo). El build sigue con
  # TypeScript 6.0.x porque Angular 22 no admite la 7; ver docs/MIGRACION-TS7.md.
  typecheck-ts7:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Type-check with TypeScript 7 (does not block)
        run: npm run typecheck:ts7

  # Una PR que cambie la app debe traer su entrada en changelog/unreleased/ (ver changelog/README.md).
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Check the changelog entry
        run: npm run changelog:check -- --base origin/${{ github.base_ref }}
