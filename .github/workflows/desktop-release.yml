name: Desktop release

# Se lanza al empujar una etiqueta vX.Y.Z. Genera los instaladores (Windows, macOS, Linux) y los sube a una
# release en BORRADOR de GitHub: publicarla (lo que activa el aviso de actualización) es una decisión manual.
on:
  push:
    tags: ['v*']
  # A mano sobre una etiqueta que ya existe (Actions → Desktop release → Run workflow en develop, con la etiqueta).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta ya existente (p. ej. v1.8.1)'
        type: string
        required: false
      publish:
        description: 'Publicar la release al terminar'
        type: boolean
        default: false
  # Lo llama release.yml (una etiqueta empujada con GITHUB_TOKEN no dispara otros workflows).
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Version coincide con la etiqueta
        run: node scripts/sync-desktop-version.mjs ${{ env.TAG != '' && format('--tag {0}', env.TAG) || '' }}
        # (una etiqueta vX.Y.Z-rc.N estampa su versión en package.json solo en este árbol de trabajo)
      - run: npm install --no-fund --no-audit
      - name: Dependencias del ayudante de IA
        run: npm install --no-fund --no-audit
        working-directory: tools/ai-phase0
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run test:ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  # Crea el borrador UNA sola vez antes del empaquetado: los 4 jobs en paralelo lo reutilizan (si cada uno
  # lo creara a la vez, saldrían borradores duplicados con los archivos repartidos).
  draft:
    needs: verify
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Crear el borrador si no existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\" and .draft) | .id" | head -n1)
          if [ -n "$id" ]; then echo "Ya hay un borrador de $TAG."; exit 0; fi
          pre=false; case "$TAG" in *-rc.*) pre=true ;; esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="${TAG#v}" -F draft=true -F prerelease=$pre --silent
          echo "Borrador de $TAG creado."

  package:
    needs: [verify, draft]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: macos-15-intel
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Herramientas de Linux (rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: node scripts/sync-desktop-version.mjs ${{ env.TAG != '' && format('--tag {0}', env.TAG) || '' }}
      - run: npm install --no-fund --no-audit
      - name: Dependencias del ayudante de IA
        run: npm install --no-fund --no-audit
        working-directory: tools/ai-phase0
      - run: npm run build
      - name: Instaladores y release en borrador
        run: npx electron-builder --projectDir desktop --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Los dos jobs de macOS suben su latest-mac.yml y el último pisa al otro: se guarda cada uno y `notes` los une.
      - name: Guardar latest-mac.yml de este procesador
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: latest-mac-${{ matrix.os }}
          path: release/latest-mac.yml
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Pone las notas (sección del CHANGELOG) en el borrador. Solo publica si se pidió explícitamente.
  notes:
    needs: package
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: latest-mac.yml de los dos procesadores
        uses: actions/download-artifact@v7
        with:
          pattern: latest-mac-*
          path: mac-feeds
      - name: Unir latest-mac.yml (arm64 + Intel)
        run: node scripts/merge-mac-feed.mjs mac-feeds/latest-mac-macos-latest/latest-mac.yml mac-feeds/latest-mac-macos-15-intel/latest-mac.yml --out latest-mac.yml
      - name: Notas desde el CHANGELOG
        run: node scripts/release-notes.mjs "$TAG" --out notes.md
      - name: Actualizar el borrador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\" and .draft) | .id")
          [ "$(echo "$ids" | grep -c .)" -le 1 ] || { echo "Hay varios borradores para $TAG; borra los sobrantes y relanza."; exit 1; }
          id=$(echo "$ids" | head -n1)
          [ -n "$id" ] || { echo "No hay borrador para $TAG"; exit 1; }
          pre=false; case "$TAG" in *-rc.*) pre=true ;; esac
          # Una RC siempre es pre-release (nunca «latest»): el aviso de actualización de las apps estables la ignora.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F body=@notes.md -f name="${TAG#v}" -F prerelease=$pre --silent
          echo "Notas puestas en el borrador de $TAG."
          # Sustituir el latest-mac.yml que dejó el último job de macOS por el unido (así el actualizador ve los dos procesadores).
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --paginate --jq '.[] | select(.name=="latest-mac.yml") | .id')
          for a in $old; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$a" --silent; done
          gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=latest-mac.yml" \
            -H 'Content-Type: text/yaml' --input latest-mac.yml --silent
          echo "latest-mac.yml con arm64 e Intel."
          if [ "$PUBLISH" = true ]; then
            # Fijar tag_name al publicar: sin esto GitHub puede dejar la release como «untagged-…» y el actualizador no la encuentra.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f tag_name="$TAG" --silent
            got=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .tag_name)
            [ "$got" = "$TAG" ] || { echo "La release quedó con la etiqueta «$got» en vez de «$TAG»."; exit 1; }
            echo "Release $TAG publicada."
          fi
