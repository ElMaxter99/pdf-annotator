name: Desktop release

# Se lanza al empujar una etiqueta vX.Y.Z. Genera los instaladores (Windows, macOS, Linux) y los sube a una
# release en BORRADOR de GitHub: publicarla (lo que activa el aviso de actualización) es una decisión manual.
on:
  push:
    tags: ['v*']
  # A mano sobre una etiqueta que ya existe (Actions → Desktop release → Run workflow en develop, con la etiqueta).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta ya existente (p. ej. v1.8.1)'
        type: string
        required: false
      publish:
        description: 'Publicar la release al terminar'
        type: boolean
        default: false
  # Lo llama release.yml (una etiqueta empujada con GITHUB_TOKEN no dispara otros workflows).
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Version coincide con la etiqueta
        run: node scripts/sync-desktop-version.mjs ${{ env.TAG != '' && format('--tag {0}', env.TAG) || '' }}
      - run: npm install --no-fund --no-audit
      - name: Dependencias del ayudante de IA
        run: npm install --no-fund --no-audit
        working-directory: tools/ai-phase0
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run test:ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  # Crea el borrador UNA sola vez antes del empaquetado: los 4 jobs en paralelo lo reutilizan (si cada uno
  # lo creara a la vez, saldrían borradores duplicados con los archivos repartidos).
  draft:
    needs: verify
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Crear el borrador si no existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\" and .draft) | .id" | head -n1)
          if [ -n "$id" ]; then echo "Ya hay un borrador de $TAG."; exit 0; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="$TAG" -F draft=true --silent
          echo "Borrador de $TAG creado."

  package:
    needs: [verify, draft]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: macos-15-intel
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Herramientas de Linux (rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: node scripts/sync-desktop-version.mjs
      - run: npm install --no-fund --no-audit
      - name: Dependencias del ayudante de IA
        run: npm install --no-fund --no-audit
        working-directory: tools/ai-phase0
      - run: npm run build
      - name: Instaladores y release en borrador
        run: npx electron-builder --projectDir desktop --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # Pone las notas (sección del CHANGELOG) en el borrador. Solo publica si se pidió explícitamente.
  notes:
    needs: package
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Notas desde el CHANGELOG
        run: node scripts/release-notes.mjs "$TAG" --out notes.md
      - name: Actualizar el borrador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\" and .draft) | .id" | head -n1)
          [ -n "$id" ] || { echo "No hay borrador para $TAG"; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F body=@notes.md -f name="$TAG" --silent
          echo "Notas puestas en el borrador de $TAG."
          if [ "$PUBLISH" = true ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false --silent
            echo "Release $TAG publicada."
          fi
