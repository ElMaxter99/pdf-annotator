name: Desktop release

# Se lanza al empujar una etiqueta vX.Y.Z. Genera los instaladores (Windows, macOS, Linux) y los sube a una
# release en BORRADOR de GitHub: publicarla (lo que activa el aviso de actualización) es una decisión manual.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Version coincide con la etiqueta
        run: node scripts/sync-desktop-version.mjs ${{ startsWith(github.ref, 'refs/tags/') && format('--tag {0}', github.ref_name) || '' }}
      - run: npm install --no-fund --no-audit
      - run: npm install --no-fund --no-audit --prefix tools/ai-phase0
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run test:ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: macos-15-intel
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Herramientas de Linux (rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: node scripts/sync-desktop-version.mjs
      - run: npm install --no-fund --no-audit
      - run: npm install --no-fund --no-audit --prefix tools/ai-phase0
      - run: npm run build
      - name: Instaladores y release en borrador
        run: npx electron-builder --projectDir desktop --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
