name: Release candidate

# «Run workflow» (Actions → Release candidate → rama develop) publica la siguiente versión de prueba
# vX.Y.Z-rc.N como PRE-RELEASE de GitHub, con los instaladores de Windows, macOS y Linux, para probarlos de
# verdad antes de la versión final. N sube solo (rc.1, rc.2…). No toca master ni package.json: la versión de
# los instaladores sale de la etiqueta. La versión final sigue siendo «Release» (release.yml).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión que se prepara, solo dígitos (p. ej. 1.9.0)'
        type: string
        required: true

concurrency:
  group: release-candidate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.rc.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - id: rc
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Versión no válida «$VERSION»: usa X.Y.Z (solo dígitos)."; exit 1; }
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION ya existe; prepara la siguiente versión."; exit 1
          fi
          # Si este commit ya tiene su RC de esta versión, se reutiliza (relanzar no duplica).
          existing=$(git tag --points-at HEAD --list "v$VERSION-rc.*" | head -n1)
          if [ -n "$existing" ]; then
            tag="$existing"
          else
            last=$(git tag --list "v$VERSION-rc.*" | sed -E 's/.*-rc\.//' | sort -n | tail -n1)
            tag="v$VERSION-rc.$(( ${last:-0} + 1 ))"
            git tag -a "$tag" -m "Release candidate $tag"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### $tag" >> "$GITHUB_STEP_SUMMARY"

  installers:
    needs: tag
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      publish: true
