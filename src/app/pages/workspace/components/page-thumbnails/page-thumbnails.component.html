<div class="thumbnails">
  <button
    type="button"
    class="thumbnails__item"
    *ngFor="let thumbnail of thumbnails; trackBy: trackByPage"
    (click)="onSelect(thumbnail)"
    [class.thumbnails__item--active]="thumbnail.pageNumber === activePage"
    [attr.aria-current]="thumbnail.pageNumber === activePage ? 'page' : null"
    [attr.aria-label]="(thumbnail.failed ? 'sidebar.thumbnails.retryLabel' : 'sidebar.thumbnails.pageLabel') | t : { index: thumbnail.pageNumber }"
    [attr.title]="(thumbnail.failed ? 'sidebar.thumbnails.retryLabel' : 'sidebar.thumbnails.pageLabel') | t : { index: thumbnail.pageNumber }"
    appInView
    (inView)="onInView(thumbnail.pageNumber, $event)"
  >
    <span class="thumbnails__badge" aria-hidden="true">{{ thumbnail.pageNumber }}</span>
    <span
      *ngIf="!thumbnail.imageUrl"
      class="thumbnails__image thumbnails__image--pending"
      [class.thumbnails__image--failed]="thumbnail.failed"
      aria-hidden="true"
      [style.aspect-ratio]="thumbnail.width + ' / ' + thumbnail.height"
    >
      <svg
        *ngIf="thumbnail.failed"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12a9 9 0 1 1-3-6.7" />
        <path d="M21 4v5h-5" />
      </svg>
    </span>
    <img
      *ngIf="thumbnail.imageUrl"
      class="thumbnails__image thumbnails__image--in"
      [src]="thumbnail.imageUrl"
      [attr.alt]="'sidebar.thumbnails.pageLabel' | t : { index: thumbnail.pageNumber }"
      [attr.width]="thumbnail.width"
      [attr.height]="thumbnail.height"
      loading="lazy"
      decoding="async"
    />
  </button>
</div>
