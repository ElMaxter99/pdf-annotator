<div class="dialog-backdrop" (click)="closed.emit()">
  <div class="dialog dialog--about" role="dialog" aria-modal="true" aria-labelledby="about-title"
    (click)="$event.stopPropagation()">
    <header class="dialog__header">
      <h2 id="about-title" class="dialog__title">{{ 'about.title' | t : { app: appName } }}</h2>
      <button #closeButton type="button" class="btn btn--ghost" (click)="closed.emit()"
        [attr.aria-label]="'about.close' | t">✕</button>
    </header>
    <div class="dialog__body">
      <p>v{{ version }}</p>
      <p>© {{ year }} {{ appName }} · {{ 'app.footer.developedBy' | t : { author: author } }}</p>
      <p>{{ 'app.footer.license' | t }} · {{ 'app.footer.openSource' | t }}</p>
    </div>
  </div>
</div>
