<main class="viewer" *ngIf="vm.pdfDoc as _">
  <div class="canvas-container" #pdfViewer (mousemove)="vm.onViewerMouseMove($event)" (mouseleave)="vm.onViewerMouseLeave()">
    <canvas #pdfCanvas class="canvas canvas--pdf"></canvas>
    <canvas #overlayCanvas class="canvas canvas--overlay"></canvas>
    <div #annotationsLayer class="annotations-layer"></div>
    <div class="hitbox" (click)="vm.onHitboxClick($event)"></div>

    @if (vm.preview(); as p) {
      <app-annotation-editor #previewEditor [vm]="vm" mode="preview" [field]="p.field"
        [leftPx]="p.field.x * vm.scale()" [topPx]="(pdfCanvas?.height ?? 0) - p.field.y * vm.scale()"></app-annotation-editor>
    }

    @if (vm.editing(); as e) {
      <app-annotation-editor #editEditor [vm]="vm" mode="edit" [field]="e.field"
        [leftPx]="e.field.x * vm.scale()" [topPx]="(pdfCanvas?.height ?? 0) - e.field.y * vm.scale()"></app-annotation-editor>
    }
  </div>
</main>
