<main class="viewer" *ngIf="vm.pdfDoc as _">
  @if (vm.selectionCount() > 0) {
    <div class="selection-bar" role="toolbar" [attr.aria-label]="'selection.toolbar' | t">
      <span class="selection-bar__count">{{ 'selection.count' | t : { count: vm.selectionCount() } }}</span>
      <div class="selection-bar__group" role="group" [attr.aria-label]="'selection.alignLabel' | t">
        @for (mode of alignModes; track mode.id) {
          <button type="button" class="selection-bar__btn" [disabled]="vm.selectionCount() < 2"
            [attr.title]="('selection.align.' + mode.id) | t" [attr.aria-label]="('selection.align.' + mode.id) | t"
            (click)="vm.alignSelection(mode.id)">{{ mode.icon }}</button>
        }
      </div>
      <div class="selection-bar__group" role="group" [attr.aria-label]="'selection.distributeLabel' | t">
        @for (mode of distributeModes; track mode.id) {
          <button type="button" class="selection-bar__btn" [disabled]="vm.selectionCount() < 3"
            [attr.title]="('selection.distribute.' + mode.id) | t" [attr.aria-label]="('selection.distribute.' + mode.id) | t"
            (click)="vm.distributeSelection(mode.id)">{{ mode.icon }}</button>
        }
      </div>
      <button type="button" class="selection-bar__btn" (click)="vm.duplicateSelection()"
        [attr.title]="'selection.duplicate' | t" [attr.aria-label]="'selection.duplicate' | t">⧉</button>
      <button type="button" class="selection-bar__btn selection-bar__btn--danger" (click)="vm.deleteSelection()"
        [attr.title]="'selection.delete' | t" [attr.aria-label]="'selection.delete' | t">🗑️</button>
      <button type="button" class="selection-bar__btn" (click)="vm.clearSelection()"
        [attr.title]="'selection.clear' | t" [attr.aria-label]="'selection.clear' | t">✕</button>
    </div>
  }
  <div class="canvas-container" #pdfViewer (mousemove)="vm.onViewerMouseMove($event)" (mouseleave)="vm.onViewerMouseLeave()">
    <canvas #pdfCanvas class="canvas canvas--pdf"></canvas>
    <canvas #overlayCanvas class="canvas canvas--overlay"></canvas>
    <div #annotationsLayer class="annotations-layer"></div>
    <div class="hitbox" (click)="vm.onHitboxClick($event)" (pointerdown)="vm.onHitboxPointerDown($event)"
      (pointermove)="vm.onHitboxPointerMove($event)" (pointerup)="vm.onHitboxPointerUp($event)"
      (pointercancel)="vm.onHitboxPointerUp($event)"></div>
    @if (vm.lasso(); as l) {
      <div class="lasso" [style.left.px]="l.left" [style.top.px]="l.top" [style.width.px]="l.width"
        [style.height.px]="l.height"></div>
    }

    @if (vm.preview(); as p) {
      <app-annotation-editor #previewEditor [vm]="vm" mode="preview" [field]="p.field"
        [leftPx]="p.field.x * vm.scale()" [topPx]="(pdfCanvas?.height ?? 0) - p.field.y * vm.scale()"></app-annotation-editor>
    }

    @if (vm.editing(); as e) {
      <app-annotation-editor #editEditor [vm]="vm" mode="edit" [field]="e.field"
        [leftPx]="e.field.x * vm.scale()" [topPx]="(pdfCanvas?.height ?? 0) - e.field.y * vm.scale()"></app-annotation-editor>
    }
  </div>
</main>
