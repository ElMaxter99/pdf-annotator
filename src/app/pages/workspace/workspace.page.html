<div class="app app--workspace" [class.app--sidebar-minimized]="vm.sidebarMinimized()" [class.app--ai-dock]="vm.aiDockVisible()">
  <app-workspace-header [vm]="vm"></app-workspace-header>
  <app-workspace-sidebar [vm]="vm"></app-workspace-sidebar>
  <app-workspace-viewer [vm]="vm"></app-workspace-viewer>
  @if (vm.aiHelper.available && vm.batchCtx()) {
    <app-ai-review [vm]="vm" (closeRequested)="vm.closeNotice('ai')"></app-ai-review>
  }
  <app-workspace-footer [vm]="vm"></app-workspace-footer>
</div>
@if (vm.paletteOpen()) {
  <app-command-palette [vm]="vm" (closed)="vm.togglePalette(false)"></app-command-palette>
}
@if (vm.shortcutsOpen()) {
  <app-shortcuts-dialog (closed)="vm.toggleShortcuts(false)"></app-shortcuts-dialog>
}
@if (vm.templatesExportOpen()) {
  <app-templates-export-dialog [templates]="vm.exportableTemplates()" (closed)="vm.toggleTemplatesExport(false)"></app-templates-export-dialog>
}
@if (vm.aboutOpen()) {
  <app-about-dialog [appName]="vm.appName" [author]="vm.appAuthor" [version]="vm.version"
    [year]="vm.currentYear" (closed)="vm.toggleAbout(false)"></app-about-dialog>
}
@if (vm.pageMapOpen()) {
  <app-page-map-dialog [vm]="vm"></app-page-map-dialog>
}
@if (vm.exportSamplesPrompt() !== null) {
  <app-export-samples-dialog [count]="vm.exportSamplesPrompt()!" (cancelled)="vm.cancelExportSamples()"
    (confirmed)="vm.confirmExportSamples($event)"></app-export-samples-dialog>
}
